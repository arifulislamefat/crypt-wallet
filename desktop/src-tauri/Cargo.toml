[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cryptwallet-crypto = { path = "../../crypto" }
cryptwallet-vault = { path = "../../vault" }
# Scrubs our copy of a passphrase arriving over IPC (see `unlock_wallet`).
zeroize = { version = "1.8" }
# Shuffles the confirmation word order in this process rather than the
# webview, so the backend can interpret the slots the user clicked.
rand_core = { version = "0.6", features = ["std", "getrandom"] }
# EIP-1559 transaction construction, RLP encoding, and the EIP-2718 typed
# envelope for signing — audited library territory, not something to
# hand-write. See sign_transaction in this file.
#
# Feature note: "primitives" is not a real feature on this crate (0.9.2) —
# verified against the downloaded source (alloy-0.9.2/Cargo.toml has no
# such feature) rather than assumed. `alloy-core`, which is where
# `Address`/`U256`/`TxKind` actually live, is a mandatory non-optional
# dependency and its re-export at `alloy::primitives` is unconditional
# (alloy-0.9.2/src/lib.rs), so nothing needs enabling for it. What's
# enabled instead, each checked against real usage below:
#   - "consensus" -> TxEip1559, SignableTransaction, Signed
#   - "eips"      -> AccessList (alloy_eips::eip2930), needed as a
#                    TxEip1559 field even though it's empty for a plain send
#   - "k256"      -> PrimitiveSignature::recover_address_from_prehash,
#                    used both in sign_transaction's own sanity check and
#                    in the self-verifying signature-recovery test
#   - "rlp"       -> the RLP/EIP-2718 encoding the "consensus" types build on
#   - "sol-types" -> the `sol!` macro and `SolCall` trait, used to encode the
#                    ERC-20 `transfer(address,uint256)` calldata for token
#                    sends (see `encode_erc20_transfer`) — deliberately not
#                    the much heavier "contract" feature, which pulls in a
#                    full RPC-calling contract client this app doesn't use;
#                    "sol-types" alone gives ABI encoding with none of that.
#   - "std"       -> default-features carries "std" among other things
#                    (a transitive reqwest/network-I/O pull-in via alloy's
#                    own default features specifically, independent of this
#                    crate's own direct `reqwest` dependency added below for
#                    the Etherscan proxy) that alloy itself doesn't need for
#                    what this app uses it for; re-added explicitly rather
#                    than pulled in wholesale from alloy's defaults
alloy = { version = "0.9", default-features = false, features = ["consensus", "eips", "k256", "rlp", "sol-types", "std"] }

# --- Solana transaction construction, signing envelope, and wire encoding ---
# Same rule as alloy above: audited library territory for transaction
# construction/serialization, not hand-written. `SolanaAccountKey`
# (cryptwallet-crypto) supplies the derived ed25519 key; everything about
# building the Message, wrapping it in a Transaction, and encoding the wire
# format comes from Solana's own SDK crates, mirroring exactly how EVM
# signing here uses alloy instead of hand-rolled RLP.
#
# "full" feature: re-exports Transaction/Signature via solana_program (see
# docs.rs/solana-sdk) -- needed since this crate alone doesn't expose them
# without it.
solana-sdk = { version = "4", features = ["full"] }
# Direct dependency (not just relying on whatever solana-sdk's "full"
# feature transitively enables) so `Pubkey`/`Hash`'s `FromStr` impls
# (feature "decode") are guaranteed available for parsing the recipient
# address and recent blockhash from untrusted frontend input.
solana-pubkey = "3"
solana-hash = "3"
# `solana_system_interface::instruction::transfer` builds the System
# Program transfer instruction -- the modern, split-crate replacement for
# the old `solana_sdk::system_instruction::transfer`. Referenced directly by
# solana-program's own docs as the way to build this instruction now.
solana-system-interface = { version = "3", features = ["bincode"] }
# ed25519-dalek is already `cryptwallet-crypto`'s dependency for
# `SolanaAccountKey`; pinned to the same "2" here so Cargo resolves both to
# one identical version -- required for `SolanaAccountKey::expose_secret`'s
# `&ed25519_dalek::SigningKey` to be usable here at all (two different
# resolved versions would be two different, incompatible types).
ed25519-dalek = { version = "2" }
# Solana's wire format for a full signed `Transaction` (signatures +
# message) is bincode-serialized -- confirmed via solana-transaction's own
# docs, which note its test/example code uses bincode for exactly this.
# Pinned to the long-stable 1.x line: bincode's later 2.x/3.x releases are
# a materially different config-based API, and 3.0.0 does not build at all
# (the crate's maintainer stopped publishing after a harassment incident,
# per its own docs.rs page) -- 1.x is what the wider Solana ecosystem's own
# tooling has used for this for years.
bincode = "1"
# Encodes the final signed transaction for the `sendTransaction` RPC's
# base64 input format (Solana's currently-recommended encoding for that
# call, over the legacy base58 option).
base64 = "0.22"
# Base58-encodes an exported Solana private key -- the format Phantom,
# Solflare, and the Solana CLI all expect for "import private key" (see
# `export_solana_private_key`). Same crate and version constraint
# `cryptwallet-crypto` already pins for the same reason as ed25519-dalek
# above: one resolved version, not a coincidentally-compatible second copy.
bs58 = "0.5"

# --- Bitcoin transaction construction, signing, and wire encoding ---
# Same rule as alloy/solana-sdk above: audited library territory for
# transaction construction/serialization/sighash computation, not hand-
# written. Evaluated the same way bech32/ripemd were for Bitcoin derivation
# (crypto/src/bitcoin.rs): `bitcoin` (crates.io/crates/bitcoin, rust-bitcoin
# org -- the same org already trusted here for `bip39`/`bech32`) is the
# foundational crate of the Rust Bitcoin ecosystem -- 14.3M total downloads,
# 3.27M recent, patch releases as recently as July 2026, and the base BDK
# (Bitcoin Dev Kit) itself builds on. No credible lighter-weight
# alternative exists for P2WPKH tx construction + BIP-143 sighash without
# dropping to hand-rolled serialization, exactly what this rule exists to
# avoid. Re-exports its own `secp256k1` (`bitcoin::secp256k1::*`) so there
# is no second, separately-versioned secp256k1 dependency to keep in sync.
#
# Used for direct Transaction construction, not the PSBT format -- this
# app has no cross-device/multi-party signing workflow to interchange a
# PSBT with (the derived key is signed with in-process, same as every
# other chain here), so PSBT's extra structure would be overhead with no
# use, not a security improvement.
bitcoin = "0.32"

# --- Etherscan transaction-history proxy ---
# Added 2026-08-22 to fix a real credential-leak finding: the Etherscan API
# key used to live in the frontend as a Vite build-time env var
# (VITE_ETHERSCAN_API_KEY), which meant it was inlined in plaintext into the
# built JS bundle (`desktop/dist/assets/*.js`) -- readable by anyone who
# inspected a shipped app's webview resources, confirmed by grepping a real
# build output. Moving the actual HTTP call here means the key now lives
# only in this process's environment (see `fetch_etherscan_list`) and never
# crosses into the webview/frontend at all, in any form.
#
# This is a deliberate architectural change, not an oversight of the
# std-feature comment on `alloy` above ("this app doesn't want" reqwest/
# network I/O) -- that comment described EVERY network call being frontend-
# initiated, which was true until this fix. Address/transaction data here is
# all public (same as every other read this app already does over IPC); the
# API key is the only sensitive value this command touches, and it's a
# third-party service credential, not anything derived from the wallet's own
# mnemonic.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Loads desktop/src-tauri/.env (gitignored, mirroring the frontend's own
# desktop/.env pattern) into the process environment at startup, so
# ETHERSCAN_API_KEY is read at runtime, not baked into any compiled or
# bundled artifact -- see `main()`'s `dotenvy::dotenv()` call.
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
# Only for testing fetch_etherscan_list, the one async command in this
# crate -- minimal features (no I/O drivers), since the tests that need it
# never touch real network/timers themselves (the one that did, hitting the
# real Etherscan API with a real key, was a temporary, disposable
# verification, already removed -- see its own commit history).
tokio = { version = "1", features = ["rt", "macros"] }

