# cargo-deny configuration for the Crypt Wallet workspace.
#
# BASELINE SNAPSHOT — this file reflects the dependency tree as scanned on
# 2026-08-16 (515 crates, `cargo-deny 0.20.2`, workspace at commit e88f943),
# plus one targeted addition on 2026-08-20 (see the `paste` entry below) —
# that update was a single-advisory delta found during a `cargo audit`/
# `cargo deny check` re-run, not a full re-scan of all 515 crates. It is not
# "solved and done." In particular:
#
#   - The `[advisories].ignore` list below downgrades 18 *specific,
#     currently-known* advisories to notes, each with a reason recorded
#     inline. It deliberately does NOT use a blanket rule (e.g. "allow all
#     unmaintained advisories") — a brand-new advisory against any crate,
#     including these same ones under a new ID, must still fail the check.
#   - Most of these exemptions are justified by "not in the Windows build
#     graph" (the GTK3 Linux-bindings cluster) or "build-dependency only"
#     (the `unic-*` cluster). Both justifications are properties of
#     *today's* dependency graph, not of the advisories themselves — an
#     upgrade to Tauri (which pulls in `muda` -> `gtk` on some platforms,
#     and `urlpattern` -> `unic-*` as a build dep of `tauri-build`) can
#     change which targets pull these crates in, or replace them outright.
#   - One entry (`paste`, RUSTSEC-2024-0436) is exempted on different grounds
#     from the other two clusters: it genuinely IS in the real Windows build
#     graph (via `alloy`, which this wallet needs for transaction signing —
#     not a wrong-platform or build-only situation at all). See that entry's
#     own comment for why it's exempted anyway.
#
# Two `cargo-audit`-only findings from the same 2026-08-20 re-run are
# DELIBERATELY NOT added here: `derivative` (RUSTSEC-2024-0388, reached via
# `ark-ff`) and `proc-macro-error2` (RUSTSEC-2026-0173, reached via
# `alloy-sol-macro`/`alloy-sol-macro-expander`). Both are present in
# Cargo.lock (cargo-audit scans the lockfile unconditionally) but resolve to
# nothing under `cargo tree -i <crate> --target all --workspace` — neither is
# actually reachable in this workspace's real build graph under its current
# feature selection (`[graph] all-features = false` below), so cargo-deny
# correctly does not flag them and an ignore entry for either would be
# exempting an advisory that was never actually failing anything. Re-check
# with the same `cargo tree -i` command if either ever starts actually
# resolving (e.g. if `alloy`'s `sol!`-macro feature or whatever pulls in
# `ark-ff` gets enabled some day).
#
# RE-REVIEW THIS FILE whenever the Tauri version (or any dependency that
# pulls in the crates named below) is upgraded. Re-run:
#   cargo tree -i <crate> --target all
# for each ignored crate and confirm the justification still holds before
# assuming these exemptions still apply. Findings and full command output
# for the original scan are not duplicated here; ask for the review if you
# need the reasoning behind a specific exemption beyond what's inline below.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # --- GTK3 bindings cluster: unmaintained, upstream is retiring GTK3 ---
    # support in favor of GTK4. Pulled in via tauri -> muda -> gtk on
    # platforms where Tauri uses a GTK-based tray/menu backend.
    #
    # Verified via `cargo tree -i <crate> --target all` (2026-08-16): every
    # crate in this group resolves ONLY through that path, and `cargo tree
    # -i glib` (no --target, i.e. the actual Windows build) returns nothing
    # — none of this cluster is in this app's real Windows dependency graph.
    # This does NOT hold if the build ever targets Linux, or if Tauri swaps
    # its tray backend to still depend on this cluster on Windows.
    { id = "RUSTSEC-2024-0411", reason = "gdkwayland-sys, unmaintained GTK3 binding; not in the Windows build graph (Linux-only path via tauri->muda->gtk)" },
    { id = "RUSTSEC-2024-0412", reason = "gdk, unmaintained GTK3 binding; not in the Windows build graph" },
    { id = "RUSTSEC-2024-0413", reason = "atk, unmaintained GTK3 binding; not in the Windows build graph" },
    { id = "RUSTSEC-2024-0414", reason = "gdkx11-sys, unmaintained GTK3 binding; not in the Windows build graph" },
    { id = "RUSTSEC-2024-0415", reason = "gtk, unmaintained GTK3 binding; not in the Windows build graph" },
    { id = "RUSTSEC-2024-0416", reason = "atk-sys, unmaintained GTK3 binding; not in the Windows build graph" },
    { id = "RUSTSEC-2024-0417", reason = "gdkx11, unmaintained GTK3 binding; not in the Windows build graph" },
    { id = "RUSTSEC-2024-0418", reason = "gdk-sys, unmaintained GTK3 binding; not in the Windows build graph" },
    { id = "RUSTSEC-2024-0419", reason = "gtk3-macros, unmaintained GTK3 binding; not in the Windows build graph" },
    { id = "RUSTSEC-2024-0420", reason = "gtk-sys, unmaintained GTK3 binding; not in the Windows build graph" },
    { id = "RUSTSEC-2024-0429", reason = "glib, unsound Iterator/DoubleEndedIterator impl; not in the Windows build graph (same GTK3 cluster)" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, unmaintained; only reached as a proc-macro dependency of glib-macros in the same GTK3 cluster, not in the Windows build graph" },

    # --- unic-* cluster: unmaintained, superseded by the `icu` crates. ---
    # Pulled in via urlpattern -> tauri-utils -> tauri-build, and
    # tauri-build is a *build-dependency* (desktop/src-tauri's
    # [build-dependencies]) — compile-time only, never linked into the
    # shipped binary. Verified via `cargo tree -i unic-common --target all`
    # (2026-08-16): the only path is through that build-dependency edge.
    # This stops holding if urlpattern/tauri-utils drops unic-* in favor of
    # icu (likely, given the deprecation notices) or if any of these crates
    # are ever pulled in as a normal (non-build) dependency instead.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range, unmaintained; build-dependency only via tauri-build->tauri-utils->urlpattern, not shipped in the binary" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common, unmaintained; build-dependency only via tauri-build->tauri-utils->urlpattern, not shipped in the binary" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property, unmaintained; build-dependency only via tauri-build->tauri-utils->urlpattern, not shipped in the binary" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, unmaintained; build-dependency only via tauri-build->tauri-utils->urlpattern, not shipped in the binary" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, unmaintained; build-dependency only via tauri-build->tauri-utils->urlpattern, not shipped in the binary" },

    # --- paste: unmaintained, but a real (non-platform-conditional) proc- ---
    # macro dependency of `alloy`, which this wallet needs for EIP-1559
    # transaction signing. Unlike every entry above, this one is NOT exempt
    # because it's on the wrong platform or a build-only edge — `cargo tree
    # -i paste --target x86_64-pc-windows-msvc` (2026-08-20) shows it's
    # squarely in the real Windows build, via alloy-primitives.
    #
    # Exempted anyway because paste is a proc-macro crate: it runs only at
    # compile time to generate identifier-concatenation code and contributes
    # no logic to the shipped binary's runtime behavior (no network, no
    # filesystem, nothing executing in the built app). The advisory is an
    # "unmaintained" notice, not a vulnerability. There is no drop-in fix
    # available from this side — `alloy` itself would need to move off
    # `paste` (e.g. to its suggested fork `pastey`) for this dependency to
    # go away. RE-REVIEW if `alloy` upgrades and no longer depends on paste,
    # or if a real vulnerability (not just "unmaintained") is ever filed
    # against it.
    { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained proc-macro dependency of alloy (needed for tx signing); compile-time only, not shipped in the binary; no alternative until alloy moves off it" },
]

[licenses]
# Every SPDX atom actually present across the workspace's 515 resolved
# crates as of the 2026-08-16 scan (`cargo metadata` license fields).
# Permissive/public-domain-equivalent licenses only. Where a crate's SPDX
# expression is an OR of several licenses (e.g. "MIT OR Apache-2.0 OR
# LGPL-2.1-or-later"), cargo-deny passes it as long as ONE listed term is
# allowed — so e.g. LGPL-2.1-or-later does not need to be listed here, since
# every crate offering it also offers MIT or Apache-2.0 as an alternative.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Our three workspace crates (crypto, vault, desktop) are all `publish =
# false` and carry no `license` field, which is correct — they are not
# meant to leave this repository. This exempts them from the license check
# instead of listing them as manual per-crate exceptions.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
