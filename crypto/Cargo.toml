[package]
name = "cryptwallet-crypto"
version = "0.1.0"
edition = "2021"
publish = false
description = "Crypt Wallet — key generation, HD derivation, and address derivation core. No signing, no networking, no I/O."

[lints]
workspace = true

[dependencies]
# --- BIP-39 mnemonic generation / import / seed derivation ---
# rust-bitcoin/rust-bip39 — the reference-grade BIP-39 crate in the Rust
# ecosystem (12.2M+ downloads, maintained under the rust-bitcoin org).
# Chosen over hand-rolling BIP-39 because a self-written wordlist/checksum
# implementation is exactly the kind of "reinvented primitive" the project
# brief explicitly forbids.
#
# NOTE: pin the exact patch version cargo resolves on first `cargo add` —
# 2.2.2 was current at spec-writing time; verify against
# https://crates.io/crates/bip39 before committing Cargo.lock.
bip39 = { version = "2.2", default-features = false, features = ["std", "rand_core", "unicode-normalization", "zeroize"] }

# --- BIP-32 hierarchical deterministic key derivation (secp256k1) ---
# RustCrypto `bip32` — implements BIP-32 generically over the `elliptic-curve`
# traits with a `secp256k1` feature backed by the pure-Rust `k256` crate.
# NOTE: verify current version against https://crates.io/crates/bip32 —
# not independently re-confirmed in this delivery; the API shape (XPrv,
# DerivationPath, derive_path) is documented on docs.rs but exact method
# names should be checked against the pinned version on first `cargo build`.
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "alloc"] }

# k256 — pure-Rust secp256k1 implementation used directly here for the final
# public-key -> Ethereum-address step, and transitively by `bip32`. Using the
# same crate `bip32` already depends on avoids pulling in a second,
# potentially inconsistent secp256k1 implementation.
#
# "sha256" (not itself the message hash — transactions are signed over their
# own Keccak256-based hash, computed in desktop/src-tauri via `alloy`) is
# needed for `SigningKey::sign_prehash_recoverable`'s RFC6979 deterministic-
# nonce derivation, which uses the curve's own digest (SHA-256 for
# secp256k1, per convention — the same choice go-ethereum and every other
# conformant secp256k1 signer makes) internally regardless of what hashed
# the message being signed. Verified against k256's own source
# (`ecdsa.rs`'s `impl DigestPrimitive for Secp256k1` is gated on this exact
# feature) rather than assumed.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256", "std"] }

# sha3 — RustCrypto's Keccak/SHA3 implementation. We use `Keccak256`
# specifically (NOT `Sha3_256` — see evm.rs doc comment for why they differ
# and why Ethereum needs the former).
sha3 = "0.10"

# zeroize — deterministic, compiler-fence-protected zeroing of secret memory
# on drop. Applied to every type in this crate that ever holds key material.
zeroize = { version = "1.8", features = ["derive"] }

# rand_core — trait-only crate providing OsRng's interface without pulling in
# `rand`'s broader (non-CSPRNG) generator surface. We construct OsRng
# explicitly inside this crate rather than accepting a caller-supplied RNG,
# so no caller can accidentally wire in a non-cryptographic source.
rand_core = { version = "0.6", features = ["std"] }

# thiserror — structured error types. Deliberately used so error Display
# strings are static and can never accidentally interpolate secret data
# (see mnemonic.rs / derivation.rs error enums: no variant carries the
# invalid input itself).
thiserror = "1.0"

# --- SLIP-0010 ed25519 hierarchical derivation + Solana address encoding ---
# There is no crates.io-established, widely-adopted SLIP-10 crate the way
# `bip39`/`bip32` are established for their specs (the one candidate found,
# `slip10_ed25519`, is a single-function, low-adoption crate not worth
# trusting for this) -- so SLIP-10 ed25519 is implemented directly in
# solana.rs from the published spec
# (https://github.com/satoshilabs/slips/blob/master/slip-0010.md), using
# only these two audited RustCrypto primitives (`hmac`+`sha2`), the same
# "well-known primitives, not a hand-rolled protocol" bar the rest of this
# crate holds to. Every value the implementation produces is checked against
# the spec's own published test vector AND an independent from-scratch
# computation done with Python's stdlib hmac/hashlib during this module's
# development (see solana.rs's test module) -- not trusted from a single
# source.
hmac = "0.12"
sha2 = "0.10"

# ed25519-dalek — the reference-grade, widely-used pure-Rust ed25519
# implementation (used by solana-sdk itself, among many others). `SigningKey`
# takes exactly the 32-byte value SLIP-10 derivation produces as its `IL` and
# performs the standard RFC 8032 seed-expansion internally -- verified
# against this crate's own docs.rs page before adding.
# NOTE: verify the exact resolved version against Cargo.lock/crates.io on
# first `cargo build`, same caveat as bip32 above.
ed25519-dalek = { version = "2", features = ["zeroize"] }

# bs58 — Base58 (Bitcoin-alphabet) encode/decode. A Solana address is exactly
# the base58 encoding of a raw 32-byte ed25519 public key, with no checksum
# or version byte (unlike Bitcoin's Base58Check) -- see solana.rs's `address`
# doc comment.
bs58 = "0.5"

# --- Bitcoin (BIP-84 native SegWit) derivation and address encoding ---
# Standard BIP-32 over secp256k1 -- the SAME algorithm and curve `bip32`/
# `k256` above already implement for EVM (unlike Solana's SLIP-10, this is
# not a different derivation scheme, just a different path prefix), so no
# new derivation dependency is needed at all. Two new primitives ARE needed
# for the address-encoding step, evaluated on the same "established,
# maintained, not the first search result" bar as every other crate here:
#
# - `ripemd`: RustCrypto's implementation (github.com/RustCrypto/hashes,
#   owned by the `rustcrypto:hashes` GitHub team) -- same organization
#   already trusted elsewhere in this workspace for sha2/sha3/hmac. Needed
#   for HASH160 = RIPEMD160(SHA256(pubkey)), the standard Bitcoin pubkey-
#   hash construction; `sha2` for the SHA256 half is already a dependency
#   above (added for SLIP-10), reused here rather than duplicated.
# - `bech32`: the rust-bitcoin organization's own crate (owned by
#   apoelstra/clarkmoody/TheBlueMatt on crates.io) -- the same organization
#   already trusted for `bip39` above, and the reference implementation
#   BIP-173/BIP-350 (SegWit address encoding) were themselves specified
#   against. Its `segwit` module provides a purpose-built
#   `encode(hrp, witness_version, program)` API that handles the bech32-
#   vs-bech32m checksum choice internally per witness version, rather than
#   this crate needing to implement that BIP-350 distinction by hand.
#
# Every value this module's derivation produces was independently
# cross-checked against a from-scratch Python implementation (stdlib
# hmac/hashlib for BIP-32, the `ecdsa` and `bech32` PyPI packages for the
# public-key math and address encoding) during development, matching the
# official BIP-84 spec's own published test vectors byte-for-byte -- see
# bitcoin.rs's test module, same discipline as the SLIP-10 vector
# verification for Solana.
# Pinned to 0.1, not the newer 0.2, deliberately: 0.2 depends on `digest`
# 0.11, while every other hash crate in this dependency tree (sha2, sha3,
# hmac) is on the `digest` 0.10 line -- 0.1 is the version that actually
# unifies with what's already here (confirmed via a real build: 0.2
# produced two incompatible copies of the `Digest` trait in the
# dependency graph, a compile error, not a silent bug, but worth pinning
# around rather than hitting every time).
ripemd = "0.1"
bech32 = "0.12"

[dev-dependencies]
hex = "0.4"
